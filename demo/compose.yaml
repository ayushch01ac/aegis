services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DEMO_DATABASE_PASSWORD:-aegis-demo-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  orders-service:
    build: ./orders-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  aegis:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AEGIS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aegis
      AEGIS_DATASOURCE_USERNAME: aegis
      AEGIS_DATASOURCE_PASSWORD: ${AEGIS_DEMO_DATABASE_PASSWORD:-aegis-demo-only}
      AEGIS_REDIS_HOST: redis
      AEGIS_JWT_SECRET: ${AEGIS_DEMO_JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      AEGIS_BOOTSTRAP_ADMIN_USERNAME: ${AEGIS_DEMO_ADMIN_USERNAME:-demo-admin}
      AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_DEMO_ADMIN_PASSWORD:-demo-password-change-before-sharing}
      AEGIS_HEALTH_SHOW_DETAILS: always
