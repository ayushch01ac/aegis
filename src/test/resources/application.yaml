management:
  endpoint:
    health:
      show-details: always

aegis:
  api:
    default-page-size: 20
    max-page-size: 100
  security:
    jwt-secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    token-ttl: PT15M
    bootstrap-admin:
      username: test-admin
      password: test-password-not-for-production
  proxy:
    connect-timeout-ms: 3000
    default-read-timeout-ms: 10000
  idempotency:
    enabled: false
    processing-ttl-seconds: 60
    wait-timeout-ms: 30000
    poll-interval-ms: 25
    completed-ttl-seconds: 86400
  rate-limit:
    enabled: true
    default-algorithm: FIXED_WINDOW
    default-capacity: 100
    default-window-seconds: 60
    default-refill-rate: 10
    fail-open: false
  retry:
    enabled: true
    default-max-attempts: 3
    default-initial-backoff-ms: 100
    default-backoff-multiplier: 2
    default-retry-on-non-idempotent: false
  circuit-breaker:
    enabled: true
    failure-threshold: 5
    open-duration-ms: 30000
    half-open-max-calls: 1
  execution:
    enabled: true
    max-workers: 16
    queue-capacity: 100
  redis:
    key-prefix: "aegis:"
  messaging:
    kafka:
      enabled: false
      proxy-events-topic: aegis.proxy-events.v1
