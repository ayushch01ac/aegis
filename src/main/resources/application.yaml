spring:
  application:
    name: aegis
  datasource:
    url: ${AEGIS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${AEGIS_DATASOURCE_USERNAME:aegis}
    password: ${AEGIS_DATASOURCE_PASSWORD:aegis}
  data:
    redis:
      host: ${AEGIS_REDIS_HOST:localhost}
      port: ${AEGIS_REDIS_PORT:6379}
      password: ${AEGIS_REDIS_PASSWORD:}
      ssl:
        enabled: ${AEGIS_REDIS_SSL:false}
      timeout: ${AEGIS_REDIS_TIMEOUT:2000ms}
      connect-timeout: ${AEGIS_REDIS_CONNECT_TIMEOUT:2000ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${AEGIS_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${AEGIS_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aegis:
  api:
    default-page-size: 20
    max-page-size: 100
  security:
    jwt-secret: ${AEGIS_JWT_SECRET:}
    token-ttl: ${AEGIS_JWT_TOKEN_TTL:PT15M}
    bootstrap-admin:
      username: ${AEGIS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:}
  proxy:
    connect-timeout-ms: ${AEGIS_PROXY_CONNECT_TIMEOUT_MS:3000}
    default-read-timeout-ms: ${AEGIS_PROXY_DEFAULT_READ_TIMEOUT_MS:10000}
  redis:
    key-prefix: ${AEGIS_REDIS_KEY_PREFIX:aegis:}
  rate-limit:
    enabled: ${AEGIS_RATE_LIMIT_ENABLED:true}
    default-algorithm: ${AEGIS_RATE_LIMIT_DEFAULT_ALGORITHM:FIXED_WINDOW}
    default-capacity: ${AEGIS_RATE_LIMIT_DEFAULT_CAPACITY:100}
    default-window-seconds: ${AEGIS_RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
    default-refill-rate: ${AEGIS_RATE_LIMIT_DEFAULT_REFILL_RATE:10}
    fail-open: ${AEGIS_RATE_LIMIT_FAIL_OPEN:false}


