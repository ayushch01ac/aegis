spring:
  application:
    name: aegis
  datasource:
    url: ${AEGIS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${AEGIS_DATASOURCE_USERNAME:aegis}
    password: ${AEGIS_DATASOURCE_PASSWORD:aegis}
  data:
    redis:
      host: ${AEGIS_REDIS_HOST:localhost}
      port: ${AEGIS_REDIS_PORT:6379}
      password: ${AEGIS_REDIS_PASSWORD:}
      ssl:
        enabled: ${AEGIS_REDIS_SSL:false}
      timeout: ${AEGIS_REDIS_TIMEOUT:2000ms}
      connect-timeout: ${AEGIS_REDIS_CONNECT_TIMEOUT:2000ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${AEGIS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${AEGIS_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${AEGIS_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aegis:
  api:
    default-page-size: 20
    max-page-size: 100
  security:
    jwt-secret: ${AEGIS_JWT_SECRET:}
    token-ttl: ${AEGIS_JWT_TOKEN_TTL:PT15M}
    bootstrap-admin:
      username: ${AEGIS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:}
  proxy:
    connect-timeout-ms: ${AEGIS_PROXY_CONNECT_TIMEOUT_MS:3000}
    default-read-timeout-ms: ${AEGIS_PROXY_DEFAULT_READ_TIMEOUT_MS:10000}
  redis:
    key-prefix: ${AEGIS_REDIS_KEY_PREFIX:aegis:}
  rate-limit:
    enabled: ${AEGIS_RATE_LIMIT_ENABLED:true}
    default-algorithm: ${AEGIS_RATE_LIMIT_DEFAULT_ALGORITHM:FIXED_WINDOW}
    default-capacity: ${AEGIS_RATE_LIMIT_DEFAULT_CAPACITY:100}
    default-window-seconds: ${AEGIS_RATE_LIMIT_DEFAULT_WINDOW_SECONDS:60}
    default-refill-rate: ${AEGIS_RATE_LIMIT_DEFAULT_REFILL_RATE:10}
    fail-open: ${AEGIS_RATE_LIMIT_FAIL_OPEN:false}
  retry:
    enabled: ${AEGIS_RETRY_ENABLED:true}
    default-max-attempts: ${AEGIS_RETRY_DEFAULT_MAX_ATTEMPTS:3}
    default-initial-backoff-ms: ${AEGIS_RETRY_DEFAULT_INITIAL_BACKOFF_MS:100}
    default-backoff-multiplier: ${AEGIS_RETRY_DEFAULT_BACKOFF_MULTIPLIER:2}
    default-retry-on-non-idempotent: ${AEGIS_RETRY_DEFAULT_RETRY_ON_NON_IDEMPOTENT:false}
  circuit-breaker:
    enabled: ${AEGIS_CIRCUIT_BREAKER_ENABLED:true}
    failure-threshold: ${AEGIS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    open-duration-ms: ${AEGIS_CIRCUIT_BREAKER_OPEN_DURATION_MS:30000}
    half-open-max-calls: ${AEGIS_CIRCUIT_BREAKER_HALF_OPEN_MAX_CALLS:1}
  execution:
    enabled: ${AEGIS_EXECUTION_ENABLED:true}
    max-workers: ${AEGIS_EXECUTION_MAX_WORKERS:16}
    queue-capacity: ${AEGIS_EXECUTION_QUEUE_CAPACITY:100}
  idempotency:
    enabled: ${AEGIS_IDEMPOTENCY_ENABLED:true}
    processing-ttl-seconds: ${AEGIS_IDEMPOTENCY_PROCESSING_TTL_SECONDS:60}
    wait-timeout-ms: ${AEGIS_IDEMPOTENCY_WAIT_TIMEOUT_MS:30000}
    poll-interval-ms: ${AEGIS_IDEMPOTENCY_POLL_INTERVAL_MS:25}
    completed-ttl-seconds: ${AEGIS_IDEMPOTENCY_COMPLETED_TTL_SECONDS:86400}
  messaging:
    kafka:
      enabled: ${AEGIS_KAFKA_ENABLED:false}
      proxy-events-topic: ${AEGIS_KAFKA_PROXY_EVENTS_TOPIC:aegis.proxy-events.v1}
