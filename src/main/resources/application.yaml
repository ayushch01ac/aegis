spring:
  application:
    name: aegis
  datasource:
    url: ${AEGIS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${AEGIS_DATASOURCE_USERNAME:aegis}
    password: ${AEGIS_DATASOURCE_PASSWORD:aegis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${AEGIS_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${AEGIS_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aegis:
  api:
    default-page-size: 20
    max-page-size: 100
